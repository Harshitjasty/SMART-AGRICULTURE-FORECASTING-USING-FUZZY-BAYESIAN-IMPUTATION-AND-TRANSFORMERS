<body class="index-page">

  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">

      <a href="/UserScreen" class="logo d-flex align-items-center me-auto">
       
        <h1 style="color: #366730;"><i class="fa fa-seedling me-2"></i> Agri<span style="color:#d9232d;">FIC</span></h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
         <li><a href="/UserScreen">User Screen</a></li>
          <li><a href="/graph" >Data Visualization</a></li>
          <li class="dropdown">
            <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Notebooks</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="../static/FICFormer.html">FICFormer Notebook</a></li>
              <li><a class="dropdown-item" href="../static/ExtensionFormer.html">Extension Former Notebook</a></li>
            </ul>
          </li>

        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

    </div>
  </header>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container">
      {% if msg %}
      <div class="toast {% if msg_type == 'success' %}success{% else %}error{% endif %}">
          <div class="toast-icon">
              {% if msg_type == 'success' %}✓{% else %}⚠{% endif %}
          </div>
          <div class="toast-content">
              {{ msg }}
          </div>
          <button class="toast-close" onclick="closeToast(this)">×</button>
          <div class="toast-progress"></div>
      </div>
      {% endif %}
  </div>
   
  <div class="form-container">
      <h3 class="form-title">Forecast Crop Growth using Sensor Data</h3>
      <form id="file-form" action="/PredictAction" method="POST" enctype="multipart/form-data">
          <div class="form-group">
              <label for="testdata">Upload Test Data (CSV File)</label>
              <div class="file-input-wrapper">
                  <input type="file" name="testdata" id="testdata" class="file-input" accept=".csv" required>
                  <div class="file-input-display" onclick="document.getElementById('testdata').click()">
                      <div class="file-icon">
                          <i class="fas fa-cloud-upload-alt"></i>
                      </div>
                      <div class="file-text">
                          <div>Click to upload CSV file</div>
                          <div class="file-name" id="file-name" style="display: none;"></div>
                      </div>
                  </div>
              </div>
          </div>
          
          <div class="button-group">
              <button type="submit" id="submit-btn">Predict Crop Growth</button>
              <button type="button" onclick="window.location.href='/UserScreen'">Back to Dashboard</button>
          </div>
      </form>
  </div>


 

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../static/vendor/php-email-form/validate.js"></script>
  <script src="../static/vendor/aos/aos.js"></script>
  <script src="../static/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="../static/vendor/imagesloaded/imagesloaded.pkgd.min.js"></script>
  <script src="../static/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="../static/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="../static/vendor/waypoints/noframework.waypoints.js"></script>
  <script src="../static/vendor/swiper/swiper-bundle.min.js"></script>

  <!-- Main JS File -->
  <script src="../static/js/main.js"></script>

  <!-- Predict Page JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('testdata');
        const fileName = document.getElementById('file-name');
        const fileDisplay = document.querySelector('.file-input-display');
        const form = document.getElementById('file-form');
        const submitBtn = document.getElementById('submit-btn');
        
        // Handle file selection
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;
                fileName.style.display = 'block';
                fileDisplay.classList.add('has-file');
            } else {
                fileName.style.display = 'none';
                fileDisplay.classList.remove('has-file');
            }
        });
        
        // Handle form submission
        form.addEventListener('submit', function(e) {
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Processing...';
            submitBtn.disabled = true;
        });
        
        // Auto-hide toast messages after 5 seconds
        const toasts = document.querySelectorAll('.toast');
        toasts.forEach(toast => {
            setTimeout(() => {
                closeToast(toast.querySelector('.toast-close'));
            }, 5000);
        });
    });
    
    // Toast functions
    function closeToast(closeBtn) {
        const toast = closeBtn.closest('.toast');
        toast.style.animation = 'slideOutRight 0.3s ease-out forwards';
        setTimeout(() => {
            toast.remove();
        }, 300);
    }
  </script>

</body>

</html>

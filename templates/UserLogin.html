<body class="index-page">

  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">

      <a href="/" class="logo d-flex align-items-center me-auto">
       
        <h1 style="color: #366730;"><i class="fa fa-seedling me-2"></i> Agri<span style="color:#d9232d;">FIC</span></h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="/" >Home</a></li>
          <li><a href="/UserLogin" class="active">User Login</a></li>
          <li><a href="/Register">Register</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

    </div>
  </header>
   <div class="form-container">
      <h3 class="form-title">User Login</h3>
      
      <!-- Animated Message Display -->
      {% if msg %}
      <div class="form-message {% if msg_type == 'success' or 'Welcome' in msg %}success{% else %}error{% endif %}">
          <div class="message-icon">
              {% if msg_type == 'success' or 'Welcome' in msg %}✓{% else %}⚠{% endif %}
          </div>
          <div class="message-text">
              {{ msg }}
          </div>
          <button class="message-close" onclick="closeFormMessage(this)">×</button>
      </div>
      {% endif %}
      <form id="login-form" action="/UserLoginAction" method="POST">
          <div class="form-group">
              <label for="username">Username</label>  
              <input type="text" name="t1" id="username" placeholder="Enter your username" required>  
          </div>
          
          <div class="form-group">
              <label for="password">Password</label>  
              <input type="password" name="t2" id="password" placeholder="Enter your password" required>  
          </div>
          
          <div class="button-group">
              <button type="submit" id="login-btn">Login</button>
              <button type="button" onclick="window.location.href='/Register'">Register</button>
          </div>
      </form>
      
      <div class="login-links">
          <a href="/">← Back to Home</a>
      </div>
   </div>


 

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../static/vendor/php-email-form/validate.js"></script>

  <script src="../static/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="../static/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="../static/vendor/waypoints/noframework.waypoints.js"></script>
  <script src="../static/vendor/swiper/swiper-bundle.min.js"></script>

  <!-- Main JS File -->
  <script src="../static/js/main.js"></script>

  <!-- User Login Form JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Auto-hide form messages after 5 seconds
        const formMessages = document.querySelectorAll('.form-message');
        formMessages.forEach(message => {
            setTimeout(() => {
                closeFormMessage(message.querySelector('.message-close'));
            }, 5000);
        });
    });
    
    // Form message functions
    function closeFormMessage(closeBtn) {
        const message = closeBtn.closest('.form-message');
        message.style.animation = 'slideOutUp 0.3s ease-out forwards';
        setTimeout(() => {
            message.remove();
        }, 300);
    }
  </script>

</body>

</html>

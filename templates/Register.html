<head>
  <meta charset="utf-8">

<body class="index-page">

  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">

      <a href="index.html" class="logo d-flex align-items-center me-auto">
       
        <h1 style="color: #366730;"><i class="fa fa-seedling me-2"></i> Agri<span style="color:#d9232d;">FIC</span></h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="/" >Home</a></li>
          <li><a href="/UserLogin">User Login</a></li>
          <li><a href="/Register" class="active">Register</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

    </div>
  </header>
   <div class="form-container">
      <h3 class="form-title">User Registration</h3>
      
      <!-- Animated Message Display -->
      {% if msg %}
      <div class="form-message {% if msg_type == 'success' %}success{% else %}error{% endif %}">
          <div class="message-icon">
              {% if msg_type == 'success' %}✓{% else %}⚠{% endif %}
          </div>
          <div class="message-text">
              {{ msg }}
          </div>
          <button class="message-close" onclick="closeFormMessage(this)">×</button>
      </div>
      {% endif %}
      <form id="register-form" action="/RegisterAction" method="POST">
          <div class="form-row">
              <div class="form-group">
                  <label for="username">Username</label>  
                  <input type="text" name="t1" id="username" placeholder="Enter your username" required>  
              </div>
              
              <div class="form-group">
                  <label for="password">Password</label>  
                  <input type="password" name="t2" id="password" placeholder="Enter your password" required>  
              </div>
          </div>
          
          <div class="form-row">
              <div class="form-group">
                  <label for="email">Email</label>  
                  <input type="email" name="t3" id="email" placeholder="Enter your email address" required>  
              </div>
              
              <div class="form-group">
                  <label for="mobile">Mobile</label>  
                  <input type="tel" name="t4" id="mobile" placeholder="Enter your mobile number" required>  
              </div>
          </div>
          
          <div class="form-group single">
              <label for="address">Address</label>  
              <input type="text" name="t5" id="address" placeholder="Enter your address" required>  
          </div>
          
          <div class="button-group">
              <button type="submit" id="register-btn">Register</button>
              <button type="button" onclick="window.location.href='/UserLogin'">Back to Login</button>
          </div>
      </form>
   </div>



 

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../static/vendor/php-email-form/validate.js"></script>
  <script src="../static/vendor/aos/aos.js"></script>
  <script src="../static/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="../static/vendor/imagesloaded/imagesloaded.pkgd.min.js"></script>
  <script src="../static/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="../static/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="../static/vendor/waypoints/noframework.waypoints.js"></script>
  <script src="../static/vendor/swiper/swiper-bundle.min.js"></script>

  <!-- Main JS File -->
  <script src="../static/js/main.js"></script>

  <!-- Registration Form JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Auto-hide form messages after 5 seconds
        const formMessages = document.querySelectorAll('.form-message');
        formMessages.forEach(message => {
            setTimeout(() => {
                closeFormMessage(message.querySelector('.message-close'));
            }, 5000);
        });
    });
    
    // Form message functions
    function closeFormMessage(closeBtn) {
        const message = closeBtn.closest('.form-message');
        message.style.animation = 'slideOutUp 0.3s ease-out forwards';
        setTimeout(() => {
            message.remove();
        }, 300);
    }
  </script>

</body>

</html>
